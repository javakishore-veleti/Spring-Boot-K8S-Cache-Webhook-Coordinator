apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-postgres-pvc
  namespace: observability
  labels:
    app: local-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: local-postgres-secret
  namespace: observability
  labels:
    app: local-postgres
type: Opaque
stringData:
  POSTGRES_DB: springdb
  POSTGRES_USER: springuser
  POSTGRES_PASSWORD: springpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
  namespace: observability
  labels:
    app: local-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-postgres
  template:
    metadata:
      labels:
        app: local-postgres
    spec:
      containers:
        - name: local-postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: local-postgres-secret  # Injecting credentials from Kubernetes Secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "springuser"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "springuser"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: local-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: local-postgres
  namespace: observability
  labels:
    app: local-postgres
spec:
  selector:
    app: local-postgres
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
