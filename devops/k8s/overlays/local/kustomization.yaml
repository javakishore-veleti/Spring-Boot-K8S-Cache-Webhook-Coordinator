resources:
  - ../../base

namePrefix: local-

commonLabels:
  environment: local

patches:
  - target:
      kind: Deployment
      name: spring-k8s-cache-webhook-coordinator
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: spring-k8s-cache-webhook-coordinator:latest
